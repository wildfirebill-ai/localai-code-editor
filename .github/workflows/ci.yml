name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---- Build + test the core packages + web on all three desktop OSes ----
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-${{ matrix.os }}
          path: apps/web/dist
          if-no-files-found: error

  # ---- Package desktop distributables per OS ----
  desktop:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            artifact: win
            glob: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.zip
          - os: macos-latest
            cmd: dist:mac
            artifact: mac
            glob: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
          - os: ubuntu-latest
            cmd: dist:linux
            artifact: linux
            glob: |
              apps/desktop/dist/**/*.AppImage
              apps/desktop/dist/**/*.deb
              apps/desktop/dist/**/*.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build everything
        run: pnpm build

      - name: Package desktop app
        working-directory: apps/desktop
        run: pnpm ${{ matrix.cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: localai-editor-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: warn

  # ---- GitHub Release for tagged versions ----
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: localai-editor-*
          merge-multiple: true

      - name: Build release summary from CHANGELOG
        id: notes
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const md = fs.readFileSync("CHANGELOG.md", "utf-8");
            const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const headerIdx = md.indexOf("## [" + tag + "]");
            let body = "";
            if (headerIdx >= 0) {
              const afterHeader = md.slice(headerIdx);
              const nextSection = afterHeader.slice(afterHeader.indexOf("\n") + 1);
              const endMatch = nextSection.match(/\n## \[|\n## Unreleased/);
              body = endMatch ? nextSection.slice(0, endMatch.index).trim() : nextSection.trim();
            }
            if (!body) body = "Release " + tag + ".";
            const header = "# LocalAI Code Editor v" + tag + "\n\n";
            let prev = "0.2.0";
            try { prev = execSync("git describe --tags --abbrev=0 HEAD~1", { encoding: "utf-8" }).trim().replace(/^v/,""); } catch {}
            fs.writeFileSync("release-notes.md", header + body + "\n\n**Full Changelog**: https://github.com/" + process.env.GITHUB_REPOSITORY + "/compare/v" + prev + "...v" + tag + "\n");
          '
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/**/*
          body_path: release-notes.md