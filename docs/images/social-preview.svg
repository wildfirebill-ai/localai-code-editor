<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="1280" y1="0" x2="1280" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Glow effect -->
  <ellipse cx="640" cy="280" rx="400" ry="200" fill="url(#glow)"/>

  <!-- Terminal window -->
  <rect x="80" y="140" width="480" height="320" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="140" width="480" height="36" rx="12" fill="#161b22"/>
  <rect x="80" y="164" width="480" height="12" fill="#161b22"/>
  <!-- Terminal dots -->
  <circle cx="100" cy="158" r="6" fill="#ff5f56"/>
  <circle cx="120" cy="158" r="6" fill="#ffbd2e"/>
  <circle cx="140" cy="158" r="6" fill="#27c93f"/>
  <!-- Terminal text -->
  <text x="100" y="210" font-family="monospace" font-size="14" fill="#7ee787">$ pnpm dev:server</text>
  <text x="100" y="235" font-family="monospace" font-size="14" fill="#8b949e">LocalAI Server running on http://localhost:4801</text>
  <text x="100" y="260" font-family="monospace" font-size="14" fill="#8b949e">Connected to Ollama (codellama:13b)</text>
  <text x="100" y="285" font-family="monospace" font-size="14" fill="#8b949e">50+ agent skills loaded</text>
  <text x="100" y="310" font-family="monospace" font-size="14" fill="#7ee787">✓ MCP servers: filesystem, git, postgres</text>
  <text x="100" y="335" font-family="monospace" font-size="14" fill="#7ee787">✓ LSP: typescript, python, rust</text>
  <text x="100" y="360" font-family="monospace" font-size="14" fill="#7ee787">✓ Sandbox: Docker-in-Docker ready</text>
  <text x="100" y="395" font-family="monospace" font-size="14" fill="#58a6ff">✨ Ready to code. Ask me anything.</text>

  <!-- Right side: Feature badges -->
  <g transform="translate(640, 160)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="520" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" font-weight="600">PRIVACY</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="16" fill="#f0f6fc">100% Local — No Cloud, No Telemetry</text>
    <text x="490" y="32" font-family="system-ui, sans-serif" font-size="20" fill="#27c93f">✓</text>

    <!-- Badge 2 -->
    <rect x="0" y="68" width="520" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" font-weight="600">AI AGENT</text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-size="16" fill="#f0f6fc">Reads, Writes, Runs Commands, Iterates</text>
    <text x="490" y="100" font-family="system-ui, sans-serif" font-size="20" fill="#27c93f">✓</text>

    <!-- Badge 3 -->
    <rect x="0" y="136" width="520" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" font-weight="600">MCP PROTOCOL</text>
    <text x="20" y="178" font-family="system-ui, sans-serif" font-size="16" fill="#f0f6fc">Connect Any Tool, Any Server</text>
    <text x="490" y="168" font-family="system-ui, sans-serif" font-size="20" fill="#27c93f">✓</text>

    <!-- Badge 4 -->
    <rect x="0" y="204" width="520" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" font-weight="600">SKILLS MARKETPLACE</text>
    <text x="20" y="246" font-family="system-ui, sans-serif" font-size="16" fill="#f0f6fc">50+ Built-in, Install More, Create Your Own</text>
    <text x="490" y="236" font-family="system-ui, sans-serif" font-size="20" fill="#27c93f">✓</text>

    <!-- Badge 5 -->
    <rect x="0" y="272" width="520" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="296" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" font-weight="600">PLATFORMS</text>
    <text x="20" y="314" font-family="system-ui, sans-serif" font-size="16" fill="#f0f6fc">Windows · macOS · Linux · Docker · Unraid</text>
    <text x="490" y="304" font-family="system-ui, sans-serif" font-size="20" fill="#27c93f">✓</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1280" height="60" fill="#161b22"/>
  <text x="640" y="616" font-family="system-ui, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">github.com/wildfirebill-ai/localai-code-editor</text>
  <!-- Accent line -->
  <rect x="0" y="578" width="1280" height="2" fill="url(#accent)"/>
</svg>
